name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Nimal-dev
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23FF5E3A&color_dots=%23E3EFFD,%23D8E7FF,%238FB8FF,%232E7CF6,%2317162B
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FFD23F&color_dots=%23232838,%231E4FA8,%232E7CF6,%237FB2FF,%23D8E7FF

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
