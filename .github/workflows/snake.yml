name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Nimal-dev
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=FF5E3A&color_dots=E3EFFD,D8E7FF,8FB8FF,2E7CF6,17162B
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=FFD23F

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
