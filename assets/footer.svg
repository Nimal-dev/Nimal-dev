<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" font-family="Fredoka, 'Segoe UI', system-ui, sans-serif"><defs><style>@font-face{font-family:'Fredoka';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
text{font-family:'Fredoka','Segoe UI',system-ui,sans-serif;}
.float{animation:float var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center;}
.pop{opacity:0;transform:scale(0.2) translateY(30px);animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.rise{opacity:0;transform:translateY(22px);animation:rise .6s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.wiggle{animation:wiggle 3.2s ease-in-out infinite;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--dl,.4s);}
.blink{animation:blink 1.1s steps(2,start) infinite;}
.cycle{opacity:0;animation:cycle 9.6s ease-in-out infinite;animation-delay:var(--dl,0s);}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(calc(var(--r,0deg) + 4deg))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{to{opacity:0}}
@keyframes cycle{0%,1%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-8px)}}
</style><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#17162b" opacity="0.12"/></pattern><clipPath id="clip"><rect x="2" y="2" width="1186" height="136" rx="28"/></clipPath></defs><g transform="translate(40 40)"><g class="float" style="--dl:0.0s;--d:4.0s;--r:0deg"><svg viewBox="0 0 100 100" width="60" height="60" fill="#ffd23f" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M50 4l12 30 32 2-25 20 9 31-28-18-28 18 9-31L6 36l32-2z"/></svg></g></g><g transform="translate(150 40)"><g class="float" style="--dl:0.3s;--d:4.3s;--r:6deg"><svg viewBox="0 0 100 100" width="60" height="60" fill="#ffffff" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M28 76a18 18 0 0 1-4-35 24 24 0 0 1 46-8 18 18 0 0 1 22 26 14 14 0 0 1-8 17z"/></svg></g></g><g transform="translate(290 40)"><g class="float" style="--dl:0.6s;--d:4.6s;--r:12deg"><svg viewBox="0 0 100 100" width="60" height="60" fill="#ff5e3a" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M50 88C20 66 6 50 6 32A20 20 0 0 1 50 20a20 20 0 0 1 44 12c0 18-14 34-44 56z"/></svg></g></g><g transform="translate(400 40)"><g class="spin" style="--dl:0.8999999999999999s;--d:4.9s;--r:18deg"><svg viewBox="0 0 100 100" width="60" height="60" fill="#2e7cf6" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M50 6c4 26 18 40 44 44-26 4-40 18-44 44-4-26-18-40-44-44 26-4 40-18 44-44z"/></svg></g></g><g transform="translate(1060 40)"><g class="float" style="--dl:1.2s;--d:5.2s;--r:24deg"><svg viewBox="0 0 100 100" width="60" height="60" fill="#7ed957" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M28 12c18-14 50-10 60 10s16 48-4 62-54 14-70-4S10 26 28 12z"/></svg></g></g><g transform="translate(960 40)"><g class="float" style="--dl:1.5s;--d:5.5s;--r:30deg"><svg viewBox="0 0 100 100" width="60" height="60" fill="#ff5e3a" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M58 4L18 56h26l-8 40 46-56H56z"/></svg></g></g><g transform="translate(880 40)"><g class="spin" style="--dl:1.7999999999999998s;--d:5.8s;--r:36deg"><svg viewBox="0 0 100 100" width="60" height="60" fill="#ffd23f" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M50 6c4 26 18 40 44 44-26 4-40 18-44 44-4-26-18-40-44-44 26-4 40-18 44-44z"/></svg></g></g><g transform="translate(409.86 40) rotate(0)"><g class="pop" style="--dl:0.1s"><rect x="7" y="7" width="380.28" height="66" rx="22" fill="#17162b"/><rect x="0" y="0" width="380.28" height="66" rx="22" fill="#ffd23f" stroke="#17162b" stroke-width="4" /><text x="190.14" y="43.8" font-size="30" font-weight="700" fill="#17162b" text-anchor="middle" class="" >Thanks for stopping by!</text></g></g></svg>