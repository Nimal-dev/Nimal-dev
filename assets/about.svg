<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Fredoka, 'Segoe UI', system-ui, sans-serif"><defs><style>@font-face{font-family:'Fredoka';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Fredoka';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
text{font-family:'Fredoka','Segoe UI',system-ui,sans-serif;}
.float{animation:float var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center;}
.pop{opacity:0;transform:scale(0.2) translateY(30px);animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.rise{opacity:0;transform:translateY(22px);animation:rise .6s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.wiggle{animation:wiggle 3.2s ease-in-out infinite;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--dl,.4s);}
.blink{animation:blink 1.1s steps(2,start) infinite;}
.cycle{opacity:0;animation:cycle 9.6s ease-in-out infinite;animation-delay:var(--dl,0s);}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(calc(var(--r,0deg) + 4deg))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{to{opacity:0}}
@keyframes cycle{0%,1%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-8px)}}
</style><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#17162b" opacity="0.12"/></pattern><clipPath id="clip"><rect x="2" y="2" width="1186" height="486" rx="28"/></clipPath></defs><rect x="12" y="12" width="1186" height="486" rx="28" fill="#17162b"/><rect x="2" y="2" width="1186" height="486" rx="28" fill="#eef6ff" stroke="#17162b" stroke-width="4"/><rect x="2" y="2" width="1186" height="486" rx="28" fill="url(#dots)" clip-path="url(#clip)"/><g transform="translate(1050 40)"><g class="float" style="--dl:0.5s;--d:4.4s;--r:8deg"><svg viewBox="0 0 100 100" width="70" height="70" fill="#ff5e3a" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M50 88C20 66 6 50 6 32A20 20 0 0 1 50 20a20 20 0 0 1 44 12c0 18-14 34-44 56z"/></svg></g></g><g transform="translate(1120 300)"><g class="spin" style="--dl:0.2s;--d:4s;--r:0deg"><svg viewBox="0 0 100 100" width="54" height="54" fill="#ffd23f" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M50 6c4 26 18 40 44 44-26 4-40 18-44 44-4-26-18-40-44-44 26-4 40-18 44-44z"/></svg></g></g><g transform="translate(1000 390)"><g class="float" style="--dl:0.9s;--d:5s;--r:0deg"><svg viewBox="0 0 100 100" width="60" height="60" fill="none" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><circle cx="50" cy="50" r="36" fill="none" stroke-width="10"/></svg></g></g><text x="54" y="78" font-size="34" font-weight="700" fill="#17162b" text-anchor="start" class="rise" style="--dl:0.1s">Software engineer from Kerala who likes building tech</text><text x="54" y="118.8" font-size="34" font-weight="700" fill="#17162b" text-anchor="start" class="rise" style="--dl:0.1s">that helps people</text><g class="rise" style="--dl:0.3s"><rect x="54" y="161.6" width="18" height="18" rx="5" fill="#2e7cf6" stroke="#17162b" stroke-width="3" transform="rotate(-8 63 170.6)"/><text x="86" y="177.6" font-size="20" font-weight="500" fill="#4d4f6b" text-anchor="start" class="" style="--dl:0.0s">iOS Engineer Intern at Infilect Technologies, shipping native Swift and SwiftUI screens from</text><text x="86" y="203.6" font-size="20" font-weight="500" fill="#4d4f6b" text-anchor="start" class="" style="--dl:0.0s">design review to the App Store.</text></g><g class="rise" style="--dl:0.42s"><rect x="54" y="223.6" width="18" height="18" rx="5" fill="#ff5e3a" stroke="#17162b" stroke-width="3" transform="rotate(-8 63 232.6)"/><text x="86" y="239.6" font-size="20" font-weight="500" fill="#4d4f6b" text-anchor="start" class="" style="--dl:0.0s">Founder of Gate Track, a Flutter app that crowdsources railway-gate timings so nobody gets</text><text x="86" y="265.6" font-size="20" font-weight="500" fill="#4d4f6b" text-anchor="start" class="" style="--dl:0.0s">stuck at a closed crossing.</text></g><g class="rise" style="--dl:0.54s"><rect x="54" y="285.6" width="18" height="18" rx="5" fill="#ffd23f" stroke="#17162b" stroke-width="3" transform="rotate(-8 63 294.6)"/><text x="86" y="301.6" font-size="20" font-weight="500" fill="#4d4f6b" text-anchor="start" class="" style="--dl:0.0s">B.Tech in Computer Science and Engineering, class of 2026, UKF College of Engineering and</text><text x="86" y="327.6" font-size="20" font-weight="500" fill="#4d4f6b" text-anchor="start" class="" style="--dl:0.0s">Technology.</text></g><g class="rise" style="--dl:0.6599999999999999s"><rect x="54" y="347.6" width="18" height="18" rx="5" fill="#7ed957" stroke="#17162b" stroke-width="3" transform="rotate(-8 63 356.6)"/><text x="86" y="363.6" font-size="20" font-weight="500" fill="#4d4f6b" text-anchor="start" class="" style="--dl:0.0s">Two years of full-stack client work before iOS: React and Node platforms, Flutter apps, and</text><text x="86" y="389.6" font-size="20" font-weight="500" fill="#4d4f6b" text-anchor="start" class="" style="--dl:0.0s">LLM-backed tools at Logiprompt.</text></g><g class="rise" style="--dl:0.78s"><rect x="54" y="409.6" width="18" height="18" rx="5" fill="#9b5de5" stroke="#17162b" stroke-width="3" transform="rotate(-8 63 418.6)"/><text x="86" y="425.6" font-size="20" font-weight="500" fill="#4d4f6b" text-anchor="start" class="" style="--dl:0.0s">I care about interfaces that feel considered, code that stays readable, and products that solve</text><text x="86" y="451.6" font-size="20" font-weight="500" fill="#4d4f6b" text-anchor="start" class="" style="--dl:0.0s">a real problem.</text></g></svg>