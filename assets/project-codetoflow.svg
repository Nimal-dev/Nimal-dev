<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" font-family="Fredoka, 'Segoe UI', system-ui, sans-serif"><defs><style>@font-face{font-family:'Fredoka';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Fredoka';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Fredoka';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
text{font-family:'Fredoka','Segoe UI',system-ui,sans-serif;}
.float{animation:float var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center;}
.pop{opacity:0;transform:scale(0.2) translateY(30px);animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.rise{opacity:0;transform:translateY(22px);animation:rise .6s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.wiggle{animation:wiggle 3.2s ease-in-out infinite;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--dl,.4s);}
.blink{animation:blink 1.1s steps(2,start) infinite;}
.cycle{opacity:0;animation:cycle 9.6s ease-in-out infinite;animation-delay:var(--dl,0s);}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(calc(var(--r,0deg) + 4deg))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{to{opacity:0}}
@keyframes cycle{0%,1%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-8px)}}
</style><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#17162b" opacity="0.12"/></pattern><clipPath id="clip"><rect x="2" y="2" width="566" height="286" rx="28"/></clipPath></defs><rect x="12" y="12" width="566" height="286" rx="28" fill="#17162b"/><rect x="2" y="2" width="566" height="286" rx="28" fill="#ffffff" stroke="#17162b" stroke-width="4"/><rect x="2" y="2" width="566" height="286" rx="28" fill="url(#dots)" clip-path="url(#clip)"/><rect x="4" y="4" width="564" height="14" rx="12" fill="#2e7cf6" stroke="#17162b" stroke-width="4" clip-path="url(#clip)"/><g transform="translate(470 34)"><g class="float" style="--dl:0.4s;--d:4.2s;--r:10deg"><svg viewBox="0 0 100 100" width="64" height="64" fill="none" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><circle cx="50" cy="50" r="36" fill="none" stroke-width="10"/></svg></g></g><text x="36" y="70" font-size="30" font-weight="700" fill="#17162b" text-anchor="start" class="rise" style="--dl:.05s">CodeToFlow</text><g transform="translate(222.85 44) rotate(0)"><g class="pop" style="--dl:0.3s"><rect x="3" y="3" width="81.58500000000001" height="32" rx="16.0" fill="#17162b"/><rect x="0" y="0" width="81.58500000000001" height="32" rx="16.0" fill="#2e7cf6" stroke="#17162b" stroke-width="4" /><text x="40.792500000000004" y="21.4" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" class="" >Dev tool</text></g></g><text x="36" y="108" font-size="19" font-weight="400" fill="#4d4f6b" text-anchor="start" class="rise" style="--dl:0.15s">Paste code, get an interactive Mermaid flowchart plus a</text><text x="36" y="133.65" font-size="19" font-weight="400" fill="#4d4f6b" text-anchor="start" class="rise" style="--dl:0.15s">spaghetti score for how tangled the logic is. Built for</text><text x="36" y="159.3" font-size="19" font-weight="400" fill="#4d4f6b" text-anchor="start" class="rise" style="--dl:0.15s">onboarding onto unfamiliar codebases.</text><g class="pop" style="--dl:0.35s"><rect x="39" y="181.95000000000002" width="61.405" height="30" rx="10" fill="#17162b"/><rect x="36" y="178.95000000000002" width="61.405" height="30" rx="10" fill="#ffffff" stroke="#17162b" stroke-width="3" /><text x="66.7025" y="199.95000000000002" font-size="15" font-weight="600" fill="#17162b" text-anchor="middle" class="" >React</text></g><g class="pop" style="--dl:0.39999999999999997s"><rect x="110.405" y="181.95000000000002" width="50.754999999999995" height="30" rx="10" fill="#17162b"/><rect x="107.405" y="178.95000000000002" width="50.754999999999995" height="30" rx="10" fill="#ffffff" stroke="#17162b" stroke-width="3" /><text x="132.7825" y="199.95000000000002" font-size="15" font-weight="600" fill="#17162b" text-anchor="middle" class="" >Vite</text></g><g class="pop" style="--dl:0.44999999999999996s"><rect x="171.16" y="181.95000000000002" width="55.72" height="30" rx="10" fill="#17162b"/><rect x="168.16" y="178.95000000000002" width="55.72" height="30" rx="10" fill="#ffffff" stroke="#17162b" stroke-width="3" /><text x="196.01999999999998" y="199.95000000000002" font-size="15" font-weight="600" fill="#17162b" text-anchor="middle" class="" >Groq</text></g><g class="pop" style="--dl:0.5s"><rect x="236.88" y="181.95000000000002" width="94.87" height="30" rx="10" fill="#17162b"/><rect x="233.88" y="178.95000000000002" width="94.87" height="30" rx="10" fill="#ffffff" stroke="#17162b" stroke-width="3" /><text x="281.315" y="199.95000000000002" font-size="15" font-weight="600" fill="#17162b" text-anchor="middle" class="" >Mermaid.js</text></g><g transform="translate(387.722 202) rotate(0)"><g class="pop" style="--dl:0.5s"><rect x="5" y="5" width="140.27800000000002" height="46" rx="23" fill="#17162b"/><rect x="0" y="0" width="140.27800000000002" height="46" rx="23" fill="#2e7cf6" stroke="#17162b" stroke-width="4" /><text x="70.13900000000001" y="29.48" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" class="" >Prototype  ↗</text></g></g></svg>