uilt for students.</text><g class="pop" style="--dl:0.35s"><rect x="39" y="181.95000000000002" width="61.405" height="30" rx="10" fill="#17162b"/><rect x="36" y="178.95000000000002" width="61.405" height="30" rx="10" fill="#ffffff" stroke="#17162b" stroke-width="3" /><text x="66.7025" y="199.95000000000002" font-size="15" font-weight="600" fill="#17162b" text-anchor="middle" class="" >React</text></g><g class="pop" style="--dl:0.39999999999999997s"><rect x="110.405" y="181.95000000000002" width="69.07" height="30" rx="10" fill="#17162b"/><rect x="107.405" y="178.95000000000002" width="69.07" height="30" rx="10" fill="#ffffff" stroke="#17162b" stroke-width="3" /><text x="141.94" y="199.95000000000002" font-size="15" font-weight="600" fill="#17162b" text-anchor="middle" class="" >Netlify</text></g><g transform="translate(399.224 202) rotate(0)"><g class="pop" style="--dl:0.5s"><rect x="5" y="5" width="128.776" height="46" rx="23" fill="#17162b"/><rect x="0" y="0" width="128.776" height="46" rx="23" fill="#2e7cf6" stroke="#17162b" stroke-width="4" /><text x="64.388" y="29.48" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" class="" >Visit site  ↗</text></g></g></svg>