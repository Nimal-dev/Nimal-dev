 about your document.</text><g class="pop" style="--dl:0.35s"><rect x="39" y="181.95000000000002" width="84.85" height="30" rx="10" fill="#17162b"/><rect x="36" y="178.95000000000002" width="84.85" height="30" rx="10" fill="#ffffff" stroke="#17162b" stroke-width="3" /><text x="78.425" y="199.95000000000002" font-size="15" font-weight="600" fill="#17162b" text-anchor="middle" class="" >Next.js 15</text></g><g class="pop" style="--dl:0.39999999999999997s"><rect x="133.85" y="181.95000000000002" width="75.83500000000001" height="30" rx="10" fill="#17162b"/><rect x="130.85" y="178.95000000000002" width="75.83500000000001" height="30" rx="10" fill="#ffffff" stroke="#17162b" stroke-width="3" /><text x="168.76749999999998" y="199.95000000000002" font-size="15" font-weight="600" fill="#17162b" text-anchor="middle" class="" >FastAPI</text></g><g class="pop" style="--dl:0.44999999999999996s"><rect x="219.685" y="181.95000000000002" width="55.72" height="30" rx="10" fill="#17162b"/><rect x="216.685" y="178.95000000000002" width="55.72" height="30" rx="10" fill="#ffffff" stroke="#17162b" stroke-width="3" /><text x="244.54500000000002" y="199.95000000000002" font-size="15" font-weight="600" fill="#17162b" text-anchor="middle" class="" >Groq</text></g><g class="pop" style="--dl:0.5s"><rect x="285.405" y="181.95000000000002" width="87.955" height="30" rx="10" fill="#17162b"/><rect x="282.405" y="178.95000000000002" width="87.955" height="30" rx="10" fill="#ffffff" stroke="#17162b" stroke-width="3" /><text x="326.3825" y="199.95000000000002" font-size="15" font-weight="600" fill="#17162b" text-anchor="middle" class="" >Llama 3.3</text></g><g class="pop" style="--dl:0.55s"><rect x="39" y="219.95000000000002" width="86.995" height="30" rx="10" fill="#17162b"/><rect x="36" y="216.95000000000002" width="86.995" height="30" rx="10" fill="#ffffff" stroke="#17162b" stroke-width="3" /><text x="79.4975" y="237.95000000000002" font-size="15" font-weight="600" fill="#17162b" text-anchor="midd