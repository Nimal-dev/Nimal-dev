<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="Fredoka, 'Segoe UI', system-ui, sans-serif"><defs><style>@font-face{font-family:'Fredoka';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Fredoka';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Fredoka';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
text{font-family:'Fredoka','Segoe UI',system-ui,sans-serif;}
.float{animation:float var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center;}
.pop{opacity:0;transform:scale(0.2) translateY(30px);animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.rise{opacity:0;transform:translateY(22px);animation:rise .6s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.wiggle{animation:wiggle 3.2s ease-in-out infinite;animation-delay:var(--dl,0s);transform-box:fill-box;transform-origin:center;}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--dl,.4s);}
.blink{animation:blink 1.1s steps(2,start) infinite;}
.cycle{opacity:0;animation:cycle 9.6s ease-in-out infinite;animation-delay:var(--dl,0s);}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(calc(var(--r,0deg) + 4deg))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{to{opacity:0}}
@keyframes cycle{0%,1%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-8px)}}
</style><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#17162b" opacity="0.12"/></pattern><clipPath id="clip"><rect x="2" y="2" width="1186" height="286" rx="28"/></clipPath></defs><rect x="12" y="12" width="1186" height="286" rx="28" fill="#17162b"/><rect x="2" y="2" width="1186" height="286" rx="28" fill="#eef6ff" stroke="#17162b" stroke-width="4"/><rect x="2" y="2" width="1186" height="286" rx="28" fill="url(#dots)" clip-path="url(#clip)"/><g transform="translate(920 30)"><g class="float" style="--dl:0.2s;--d:5s;--r:0deg"><svg viewBox="0 0 100 100" width="110" height="110" fill="#ffffff" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M28 76a18 18 0 0 1-4-35 24 24 0 0 1 46-8 18 18 0 0 1 22 26 14 14 0 0 1-8 17z"/></svg></g></g><g transform="translate(1080 160)"><g class="float" style="--dl:0.6s;--d:4s;--r:14deg"><svg viewBox="0 0 100 100" width="70" height="70" fill="#ffd23f" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M50 4l12 30 32 2-25 20 9 31-28-18-28 18 9-31L6 36l32-2z"/></svg></g></g><g transform="translate(860 180)"><g class="float" style="--dl:0.9s;--d:3.8s;--r:-12deg"><svg viewBox="0 0 100 100" width="56" height="56" fill="#ff5e3a" stroke="#17162b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M58 4L18 56h26l-8 40 46-56H56z"/></svg></g></g><g transform="translate(54 46) rotate(-4)"><g class="wiggle" style="--dl:0.0s"><rect x="4" y="4" width="115.6" height="42" rx="21.0" fill="#17162b"/><rect x="0" y="0" width="115.6" height="42" rx="21.0" fill="#ff5e3a" stroke="#17162b" stroke-width="4" /><text x="57.8" y="28.2" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" class="" >Let's talk</text></g></g><text x="54" y="136" font-size="36" font-weight="700" fill="#17162b" text-anchor="start" class="rise" style="--dl:0.1s">Building something for iOS, or a product that</text><text x="54" y="177.4" font-size="36" font-weight="700" fill="#17162b" text-anchor="start" class="rise" style="--dl:0.1s">needs a full-stack hand?</text><text x="54" y="228.8" font-size="22" font-weight="400" fill="#4d4f6b" text-anchor="start" class="rise" style="--dl:.25s">Drop me a line. I reply fastest on LinkedIn and email.</text></svg>